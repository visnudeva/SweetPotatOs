---
# SweetPotatOs Calamares settings
modules-search: [ local ]

instances:
- id:       welcome
  module:   welcome
- id:       finished
  module:   finished
- id:       fix-mkinitcpio
  module:   shellprocess
  config:   shellprocess-fix-mkinitcpio.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  # Ly (ly@tty2) is enabled by services-systemd; Calamares has no Ly DM backend.
  - services-systemd
  - initcpiocfg
  - shellprocess@fix-mkinitcpio
  - initcpio
  - grubcfg
  - bootloader
  - packages
  - umount
- show:
  - finished

branding: sweetpotatos

prompt-install: true
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true

requirements:
  check:
    - storage
    - ram
    - power
    - internet
  required:
    - storage
    - ram
  optional:
    - power
    - internet
