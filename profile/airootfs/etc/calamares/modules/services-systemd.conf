---
# Enable Ly on tty2 and NetworkManager on the installed system.
# (Calamares displaymanager has no Ly backend; do not re-add that module.)
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true

  - name: "ly@tty2.service"
    action: "enable"
    mandatory: true

  - name: "iwd.service"
    action: "disable"

  - name: "systemd-networkd.service"
    action: "disable"

  - name: "systemd-networkd-wait-online.service"
    action: "disable"

  # Keep off by default (live ISO too). Re-enable: systemctl enable --now <unit>
  - name: "sshd.service"
    action: "disable"

  - name: "ModemManager.service"
    action: "disable"

  - name: "vboxservice.service"
    action: "disable"

  - name: "vmtoolsd.service"
    action: "disable"

  - name: "vmware-vmblock-fuse.service"
    action: "disable"

  - name: "hv_fcopy_daemon.service"
    action: "disable"
