---
# Ensure /etc/default/grub exists and has sensible defaults before grub-mkconfig.
overwrite: false
prefer_grub_d: false
keep_distributor: false
# Quiet + splash so the WhiteLogo is not sandwiched between two text bursts.
kernel_params: [ "quiet", "splash", "loglevel=3", "systemd.show_status=false", "rd.systemd.show_status=false", "rd.udev.log_level=3" ]

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: "false"
