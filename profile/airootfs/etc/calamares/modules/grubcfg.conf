---
# Ensure /etc/default/grub exists and has sensible defaults before grub-mkconfig.
overwrite: false
prefer_grub_d: false
keep_distributor: false
# The grub package already ships /etc/default/grub into the target, so without
# this the defaults below (including BOOTNEXT) are skipped and grub 2.16+
# lists every firmware Boot#### as "UEFI …" / "QEMU …" in the menu.
always_use_defaults: true
kernel_params: [ "quiet", "splash" ]

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: "false"
    # grub 2.16+ otherwise lists every firmware Boot#### as "(EFI BootNext)".
    GRUB_DISABLE_BOOTNEXT: true
