---
# Remove live-environment packages from the installed system
backend: pacman

skip_if_no_internet: false
update_db: false
update_system: false

operations:
  - remove:
      - calamares
      - arch-install-scripts
      - mkinitcpio-archiso
      - mkinitcpio-nfs-utils
      - darkhttpd
      - memtest86+
      - memtest86+-efi
      - syslinux
      - edk2-shell
      - livecd-sounds
      - nbd
      - ndisc6
      - nfs-utils
      - testdisk
      - clonezilla
      - cloud-init
  - try_remove:
      - virtualbox-guest-utils-nox
      - open-vm-tools
      - qemu-guest-agent
      - hyperv
