---
# Apply Calamares keyboard choice to the installed user's Swirl config.
# GS keys must use ${gs[...]} (bare gs[...] is passed literally and breaks the script).
dontChroot: false
timeout: 30
verbose: true

script:
  # Leading "-" → do not abort the install if this tweak fails.
  - "-/usr/local/bin/sweetpotatos-fix-sway-keyboard '${USER}' '${gs[keyboardLayout]}' '${gs[keyboardVariant]}'"

i18n:
  name: "Configuring Swirl keyboard"
