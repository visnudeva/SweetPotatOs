---
# Detect Turing+ NVIDIA GPUs and install nvidia-open when online.
# Prefixed with "-" so a failed download cannot abort the whole install.
dontChroot: false
timeout: 1800
verbose: true

script:
  - command: "-/usr/local/bin/sweetpotatos-install-nvidia"
    timeout: 1800

i18n:
  name: "NVIDIA drivers"
