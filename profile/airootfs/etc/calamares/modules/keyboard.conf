---
# NOTE: ckbcomp is required for keyboard layout previews.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/usr/share/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: false

# Wayland live session: Calamares updates locale1; sweetpotatos-sway-xkb-watch
# polls locale1 (busctl) and mirrors that into Swirl. Installed system gets
# vconsole + X11 conf via locale1.
useLocale1: true
guessLayout: true

configure:
  kwin: false
  gnome: false
