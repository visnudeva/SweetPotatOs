---
# Do not recreate the live ISO user on the target system
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - storage
    - optical
    - network
    - power
    - input

autologinGroup:  autologin
# Creates /etc/sudoers.d/10-installer for %wheel (also ship 10-wheel in airootfs).
sudoersGroup:    wheel
sudoersConfigureWithGroup: true

doAutologin:     false

setRootPassword: true
doReusePassword: false

passwordRequirements:
    minLength: 1
    maxLength: -1

writeGenericMetadata: true
