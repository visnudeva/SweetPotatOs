# SweetPotato kitty terminal
# potato red #a73b50 | potato orange #f79b29 | charcoal #1d1f21

font_family      Noto Sans Mono
font_size        11
window_padding_width 8

# Cursor trail (ms idle before trail follows)
cursor_trail       200
cursor_trail_decay 0.1 0.4
cursor_trail_color #f79b29

# Transparent window (Wayland compositor)
background_opacity         0.85
dynamic_background_opacity yes

foreground #f5e6e8
background #1d1f21

color0  #1d1f21
color1  #a73b50
color2  #c47a3a
color3  #f79b29
color4  #8a5a62
color5  #c45c72
color6  #d4894a
color7  #f5e6e8
color8  #5a5a5a
color9  #c45c72
color10 #e09a5a
color11 #ffb84d
color12 #a73b50
color13 #e07088
color14 #f79b29
color15 #ffffff

selection_foreground #1d1f21
selection_background #f79b29

url_color #f79b29

enable_audio_bell no
confirm_os_window_close 0
