# SweetPotato — networkmanager-dmenu (Wi‑Fi via swirlmenu)

[dmenu]
dmenu_command = swirlmenu
active_chars = ==
compact = False
wifi_chars = ▂▄▆█
format = {name}  {sec}  {bars}
list_saved = False
prompt = Networks

[dmenu_passphrase]
obscure = True
obscure_color = #1d1f21

[editor]
terminal = foot
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
