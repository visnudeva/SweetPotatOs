# SweetPotato overrides for Ly (TUI login)
# Colors are 0xSSRRGGBB — charcoal / potato red / soft fg
# Sessions: only Swirl (curated dir — stock sway.desktop is removed)

allow_empty_password = false
animation = none
asterisk = *
bg = 0x001d1f21
blank_box = true
border_fg = 0x00ffffff
box_title = null
clock = %H:%M
default_input = password
error_bg = 0x001d1f21
error_fg = 0x01a73b50
fg = 0x00f5e6e8
full_color = true
save = true
shell = false
xinitrc = null
waylandsessions = /etc/ly/wayland-sessions
xsessions = null
