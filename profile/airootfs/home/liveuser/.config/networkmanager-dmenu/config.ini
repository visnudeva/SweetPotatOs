# SweetPotato — networkmanager-dmenu (Wi‑Fi via wmenu)
# Colors match the app launcher: charcoal / potato orange / soft fg

[dmenu]
dmenu_command = wmenu -i -f "Noto Sans 11" -N 1d1f21ff -n f5e6e8ff -M a73b50ff -m ffffffff -S f79b29ff -s 1d1f21ff
active_chars = ==
compact = False
wifi_chars = ▂▄▆█
format = {name}  {sec}  {bars}
list_saved = False
prompt = Networks

[dmenu_passphrase]
obscure = True
obscure_color = #1d1f21

[editor]
terminal = foot
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
