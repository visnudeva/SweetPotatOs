# SweetPotatOs overlay packages (swirl, yay-bin, sweetpotatos, …)
# Installed by the sweetpotatos package; enabled via Include in /etc/pacman.conf.
#
# SourceForge serves files via HTTP redirects; pacman needs curl -L in
# /etc/pacman.conf (migration 004 / spo-upgrade sets this automatically).

[sweetpotatos]
SigLevel = Optional TrustAll
Server = https://downloads.sourceforge.net/project/sweetpotatos/repo/x86_64
