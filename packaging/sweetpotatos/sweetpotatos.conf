# SweetPotatOs overlay packages (swirl, yay-bin, sweetpotatos, …)
# Installed by the sweetpotatos package; enabled via Include in /etc/pacman.conf.
#
# Unsigned repo — use SigLevel = Never (Optional TrustAll can trigger gpgme errors).
# GitHub release CDN redirects: spo-upgrade fetches with curl -L.

[sweetpotatos]
SigLevel = Never
Server = https://github.com/visnudeva/SweetPotatOs/releases/download/pacman-repo
