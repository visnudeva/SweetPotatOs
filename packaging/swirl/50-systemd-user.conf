# swirl does not set DISPLAY/WAYLAND_DISPLAY in the systemd user environment
# (same approach as Arch's sway package / FS#63021).

# Prefer Sway-compatible env so stock portals/tools work; also export SWIRL identity.
exec systemctl --user set-environment XDG_CURRENT_DESKTOP=swirl:sway
exec systemctl --user import-environment DISPLAY \
                                         SWAYSOCK \
                                         WAYLAND_DISPLAY \
                                         XDG_CURRENT_DESKTOP

exec hash dbus-update-activation-environment 2>/dev/null && \
     dbus-update-activation-environment --systemd DISPLAY \
                                                  SWAYSOCK \
                                                  XDG_CURRENT_DESKTOP=swirl:sway \
                                                  WAYLAND_DISPLAY
