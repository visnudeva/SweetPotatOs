# Override Arch sway's 50-systemd-user.conf (loads later via 99-*).
# Set desktop identity to Swirl for portals, systemd user env, and fastfetch.

exec systemctl --user set-environment XDG_CURRENT_DESKTOP=swirl
exec systemctl --user import-environment DISPLAY \
                                         SWAYSOCK \
                                         WAYLAND_DISPLAY \
                                         XDG_CURRENT_DESKTOP

exec hash dbus-update-activation-environment 2>/dev/null && \
     dbus-update-activation-environment --systemd DISPLAY \
                                                  SWAYSOCK \
                                                  XDG_CURRENT_DESKTOP=swirl \
                                                  WAYLAND_DISPLAY
